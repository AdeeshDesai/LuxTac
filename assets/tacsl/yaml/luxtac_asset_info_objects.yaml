# Object table for the LuxTac scripts, selected by env.asset_info_filename.
#
# lux_<shape>_<orientation>: the alignment objects (cuboid 20x20, cylinder D25, ellipse
# 40x20, peg D15), meshes from scripts/make_luxtac_objs.py.
# lux_peg_insert, lux_usb: the teleop insertion tasks.
#
# length is a staging parameter, not the object's size: it fixes where the plug origin
# lands at reset. The alignment objects all declare 0.054, which puts the cross-section
# centre on the pad centre. width/depth are the cross-section extents. density does not
# set the mass: every LuxTac URDF carries an explicit <inertial>.

lux_cuboid_vert:
    luxtac_cuboid_vert:
        urdf_par_dir: 'luxtac'
        urdf_path: 'luxtac_cuboid_vert'
        width: 0.02
        depth: 0.02
        length: 0.054
        density: 1240.0
        friction: 1.0
        grasp_offset: 0.02
        plug_width: 0.02
    round_hole_5mm:
        urdf_par_dir: 'luxtac'
        urdf_path: 'luxtac_round_hole_5mm'
        width: 0.006
        depth: 0.025
        height: 0.028
        density: 8000.0
        friction: 1.0

